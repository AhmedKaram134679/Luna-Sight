name: LunaSight DE441 Dense Temporal Limb Continuity

on:
  workflow_dispatch:
  push:
    branches:
      - science/de441-continuous-limb-tracking
      - science/de441-limb-temporal-convergence
      - science/de441-limb-convergence-sharded
      - science/de441-convergence-acceptance-report
    paths:
      - .github/workflows/lunasight-de441-continuous-limb.yml
      - LunaSight_SPICE_Validation/site_observer_spk/verify_de441_solar_bent_limb_continuity.py
      - LunaSight_SPICE_Validation/site_observer_spk/compare_de441_limb_temporal_convergence.py
      - LunaSight_SPICE_Validation/site_observer_spk/test_de441_limb_convergence_schema.py
      - LunaSight_SPICE_Validation/site_observer_spk/verify_de441_solar_bent_limb_expanded.py
      - LunaSight_SPICE_Validation/site_observer_spk/finite_distance_bent_ray.py
      - LunaSight_SPICE_Validation/site_observer_spk/point_mass_light_deflection.py
      - LunaSight_SPICE_Validation/site_observer_spk/verify_limbpt_and_geometry.py

permissions:
  contents: read

concurrency:
  group: lunasight-de441-convergence-sharded-${{ github.ref }}
  cancel-in-progress: false

env:
  LUNASIGHT_PLANETARY_SPKS: ${{ github.workspace }}/LunaSight_SPICE_Validation/kernels/de441_part-1.bsp:${{ github.workspace }}/LunaSight_SPICE_Validation/kernels/de441_part-2.bsp
  LUNASIGHT_CONTINUITY_START_UTC: "2026-11-02T14:12:00"
  LUNASIGHT_CONTINUITY_BASIS_ANCHOR_UTC: "2026-11-02T14:12:00"
  LUNASIGHT_MAX_POINT_STEP_KM: "100"
  LUNASIGHT_MAX_DIRECTION_STEP_ARCSEC: "0.1"

jobs:
  coarse:
    name: Full-interval 5-second reference sweep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated science branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 scipy==1.14.1 spiceypy==6.0.0
      - name: Download official DE441 planetary SPK parts
        working-directory: LunaSight_SPICE_Validation/kernels
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --output de441_part-1.bsp.part https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp
          mv de441_part-1.bsp.part de441_part-1.bsp
          curl --fail --location --retry 5 --retry-all-errors --output de441_part-2.bsp.part https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
          mv de441_part-2.bsp.part de441_part-2.bsp
          test -s de441_part-1.bsp
          test -s de441_part-2.bsp
          sha256sum de441_part-1.bsp de441_part-2.bsp
      - name: Validate CSV schema contract before numerical work
        working-directory: LunaSight_SPICE_Validation/site_observer_spk
        run: python -m unittest -v test_de441_limb_convergence_schema.py
      - name: Track all branches at 5-second resolution
        working-directory: LunaSight_SPICE_Validation/site_observer_spk
        env:
          LUNASIGHT_CONTINUITY_STEP_SECONDS: "5"
          LUNASIGHT_CONTINUITY_DURATION_SECONDS: "240"
          LUNASIGHT_CONTINUITY_OUTPUT: de441_limb_continuity_5s.csv
        run: python verify_de441_solar_bent_limb_continuity.py
      - name: Upload 5-second reference data
        uses: actions/upload-artifact@v4
        with:
          name: lunasight-de441-coarse-reference
          path: LunaSight_SPICE_Validation/site_observer_spk/de441_limb_continuity_5s.csv
          if-no-files-found: error
          retention-days: 30

  fine:
    name: 1-second sweep shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout isolated science branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 scipy==1.14.1 spiceypy==6.0.0
      - name: Download official DE441 planetary SPK parts
        working-directory: LunaSight_SPICE_Validation/kernels
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --output de441_part-1.bsp.part https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp
          mv de441_part-1.bsp.part de441_part-1.bsp
          curl --fail --location --retry 5 --retry-all-errors --output de441_part-2.bsp.part https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
          mv de441_part-2.bsp.part de441_part-2.bsp
          test -s de441_part-1.bsp
          test -s de441_part-2.bsp
      - name: Validate CSV schema contract before numerical work
        working-directory: LunaSight_SPICE_Validation/site_observer_spk
        run: python -m unittest -v test_de441_limb_convergence_schema.py
      - name: Track shard with one-epoch overlap at each internal boundary
        working-directory: LunaSight_SPICE_Validation/site_observer_spk
        env:
          LUNASIGHT_CONTINUITY_START_UTC: ${{ matrix.shard == 0 && '2026-11-02T14:12:00' || '' }}
          LUNASIGHT_CONTINUITY_STEP_SECONDS: "1"
          LUNASIGHT_CONTINUITY_DURATION_SECONDS: "60"
          LUNASIGHT_CONTINUITY_OUTPUT: de441_limb_continuity_1s_shard_${{ matrix.shard }}.csv
        run: |
          set -euo pipefail
          SHARD_START=$(python -c "from datetime import datetime,timedelta; t=datetime.fromisoformat('2026-11-02T14:12:00')+timedelta(seconds=60*int('${{ matrix.shard }}')); print(t.isoformat(timespec='seconds'))")
          export LUNASIGHT_CONTINUITY_START_UTC="$SHARD_START"
          python verify_de441_solar_bent_limb_continuity.py
      - name: Upload shard data
        uses: actions/upload-artifact@v4
        with:
          name: lunasight-de441-fine-shard-${{ matrix.shard }}
          path: LunaSight_SPICE_Validation/site_observer_spk/de441_limb_continuity_1s_shard_${{ matrix.shard }}.csv
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Validate coverage, overlaps, and 5s-to-1s convergence
    runs-on: ubuntu-latest
    needs: [coarse, fine]
    timeout-minutes: 30
    steps:
      - name: Checkout isolated science branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 scipy==1.14.1
      - name: Download coarse and all fine-shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lunasight-de441-*
          path: LunaSight_SPICE_Validation/site_observer_spk/artifacts
          merge-multiple: true
      - name: Validate CSV schema contract
        working-directory: LunaSight_SPICE_Validation/site_observer_spk
        run: python -m unittest -v test_de441_limb_convergence_schema.py
      - name: Compare complete 5-second and 1-second coverage
        working-directory: LunaSight_SPICE_Validation/site_observer_spk
        run: |
          python compare_de441_limb_temporal_convergence.py \
            --coarse artifacts/de441_limb_continuity_5s.csv \
            --fine-glob 'artifacts/de441_limb_continuity_1s_shard_*.csv' \
            --output de441_limb_convergence_comparison.csv
      - name: Upload convergence report
        uses: actions/upload-artifact@v4
        with:
          name: lunasight-de441-convergence-report
          path: |
            LunaSight_SPICE_Validation/site_observer_spk/de441_limb_convergence_comparison.csv
            LunaSight_SPICE_Validation/site_observer_spk/de441_limb_convergence_comparison_overlap_report.csv
            LunaSight_SPICE_Validation/site_observer_spk/de441_limb_convergence_comparison_acceptance_summary.csv
          if-no-files-found: error
          retention-days: 30
