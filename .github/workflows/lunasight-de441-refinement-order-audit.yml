name: LunaSight DE441 Observed Refinement Order Audit

on:
  push:
    branches:
      - science/de441-convergence-order-audit
    paths:
      - .github/workflows/lunasight-de441-refinement-order-audit.yml
      - LunaSight_SPICE_Validation/site_observer_spk/audit_de441_observed_refinement_order.py
      - LunaSight_SPICE_Validation/site_observer_spk/compare_de441_subsecond_limb_convergence.py

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned audit dependencies
        run: |
          python -m pip install numpy==2.1.3 scipy==1.14.1
      - name: Download existing successful subsecond sweep artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42117838467
          pattern: lunasight-de441-subsecond-*
          path: LunaSight_SPICE_Validation/site_observer_spk/artifacts
          merge-multiple: true
      - name: Audit observed refinement order without rerunning SPICE
        working-directory: LunaSight_SPICE_Validation/site_observer_spk
        run: |
          python audit_de441_observed_refinement_order.py \
            --one-glob 'artifacts/de441_limb_subsecond_1s_shard_*.csv' \
            --half-glob 'artifacts/de441_limb_subsecond_0.5s_shard_*.csv' \
            --quarter-glob 'artifacts/de441_limb_subsecond_0.25s_shard_*.csv' \
            --output de441_observed_refinement_order_summary.csv
      - name: Upload refinement-order audit
        uses: actions/upload-artifact@v4
        with:
          name: lunasight-de441-refinement-order-audit
          path: |
            LunaSight_SPICE_Validation/site_observer_spk/de441_observed_refinement_order_summary.csv
            LunaSight_SPICE_Validation/site_observer_spk/de441_observed_refinement_order_summary_detail.csv
          if-no-files-found: error
          retention-days: 30
