name: LunaSight DE441 Independent Crossing Event Validation

on:
  push:
    branches:
      - science/de441-independent-crossing-validation
    paths:
      - .github/workflows/lunasight-de441-independent-crossing-validation.yml
      - LunaSight_SPICE_Validation/site_observer_spk/verify_de441_independent_crossing.py

permissions:
  contents: read

concurrency:
  group: lunasight-de441-independent-crossing-validation
  cancel-in-progress: false

jobs:
  validate-crossing-event:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LUNASIGHT_PLANETARY_SPKS: ${{ github.workspace }}/LunaSight_SPICE_Validation/kernels/de441_part-1.bsp:${{ github.workspace }}/LunaSight_SPICE_Validation/kernels/de441_part-2.bsp
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 scipy==1.14.1 spiceypy==6.0.0
      - name: Download official DE441 planetary SPK parts
        working-directory: LunaSight_SPICE_Validation/kernels
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --output de441_part-1.bsp.part https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp
          mv de441_part-1.bsp.part de441_part-1.bsp
          curl --fail --location --retry 5 --retry-all-errors --output de441_part-2.bsp.part https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
          mv de441_part-2.bsp.part de441_part-2.bsp
          test -s de441_part-1.bsp
          test -s de441_part-2.bsp
          sha256sum de441_part-1.bsp de441_part-2.bsp
      - name: Execute independent crossing event validation
        run: |
          set -euo pipefail
          python LunaSight_SPICE_Validation/site_observer_spk/verify_de441_independent_crossing.py | tee de441_independent_crossing_event.log
      - name: Upload isolated crossing event evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunasight-de441-independent-crossing-event
          path: |
            de441_independent_crossing_event.log
            LunaSight_SPICE_Validation/site_observer_spk/de441_independent_crossing_event_results.json
            LunaSight_SPICE_Validation/site_observer_spk/de441_independent_crossing_event_results.csv
          if-no-files-found: warn
          retention-days: 30
