name: LunaSight DE441 Subsecond Temporal Convergence

on:
  workflow_dispatch:
  push:
    branches:
      - science/de441-subsecond-temporal-convergence
    paths:
      - .github/workflows/lunasight-de441-subsecond-convergence.yml
      - LunaSight_SPICE_Validation/site_observer_spk/verify_de441_subsecond_limb_continuity.py
      - LunaSight_SPICE_Validation/site_observer_spk/compare_de441_subsecond_limb_convergence.py
      - LunaSight_SPICE_Validation/site_observer_spk/verify_de441_solar_bent_limb_expanded.py
      - LunaSight_SPICE_Validation/site_observer_spk/finite_distance_bent_ray.py
      - LunaSight_SPICE_Validation/site_observer_spk/point_mass_light_deflection.py
      - LunaSight_SPICE_Validation/site_observer_spk/verify_limbpt_and_geometry.py

permissions:
  contents: read

concurrency:
  group: lunasight-de441-subsecond-${{ github.ref }}
  cancel-in-progress: false

env:
  LUNASIGHT_PLANETARY_SPKS: ${{ github.workspace }}/LunaSight_SPICE_Validation/kernels/de441_part-1.bsp:${{ github.workspace }}/LunaSight_SPICE_Validation/kernels/de441_part-2.bsp
  LUNASIGHT_MAX_POINT_STEP_KM: "100"
  LUNASIGHT_MAX_DIRECTION_STEP_ARCSEC: "0.1"

jobs:
  sweep:
    name: ${{ matrix.step }}s sweep shard ${{ matrix.shard }} (${{ matrix.duration }}s)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { step: 1, duration: 60, shard: 0 }
          - { step: 1, duration: 60, shard: 1 }
          - { step: 1, duration: 60, shard: 2 }
          - { step: 1, duration: 60, shard: 3 }
          - { step: 0.5, duration: 60, shard: 0 }
          - { step: 0.5, duration: 60, shard: 1 }
          - { step: 0.5, duration: 60, shard: 2 }
          - { step: 0.5, duration: 60, shard: 3 }
          - { step: 0.25, duration: 20, shard: 0 }
          - { step: 0.25, duration: 20, shard: 1 }
          - { step: 0.25, duration: 20, shard: 2 }
          - { step: 0.25, duration: 20, shard: 3 }
          - { step: 0.25, duration: 20, shard: 4 }
          - { step: 0.25, duration: 20, shard: 5 }
          - { step: 0.25, duration: 20, shard: 6 }
          - { step: 0.25, duration: 20, shard: 7 }
          - { step: 0.25, duration: 20, shard: 8 }
          - { step: 0.25, duration: 20, shard: 9 }
          - { step: 0.25, duration: 20, shard: 10 }
          - { step: 0.25, duration: 20, shard: 11 }
    steps:
      - name: Checkout isolated science branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 scipy==1.14.1 spiceypy==6.0.0
      - name: Download official DE441 planetary SPK parts
        working-directory: LunaSight_SPICE_Validation/kernels
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --output de441_part-1.bsp.part https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp
          mv de441_part-1.bsp.part de441_part-1.bsp
          curl --fail --location --retry 5 --retry-all-errors --output de441_part-2.bsp.part https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp
          mv de441_part-2.bsp.part de441_part-2.bsp
          test -s de441_part-1.bsp
          test -s de441_part-2.bsp
          sha256sum de441_part-1.bsp de441_part-2.bsp
      - name: Track four-minute interval shard with one-epoch boundary overlap
        working-directory: LunaSight_SPICE_Validation/site_observer_spk
        env:
          LUNASIGHT_CONTINUITY_START_UTC: "2026-11-02T14:12:00"
          LUNASIGHT_CONTINUITY_BASIS_ANCHOR_UTC: "2026-11-02T14:12:00"
          LUNASIGHT_CONTINUITY_STEP_SECONDS: ${{ matrix.step }}
          LUNASIGHT_CONTINUITY_DURATION_SECONDS: ${{ matrix.duration }}
          LUNASIGHT_CONTINUITY_OUTPUT: de441_limb_subsecond_${{ matrix.step }}s_shard_${{ matrix.shard }}.csv
        run: |
          set -euo pipefail
          SHARD_START=$(python -c "from datetime import datetime,timedelta; t=datetime.fromisoformat('2026-11-02T14:12:00')+timedelta(seconds=${{ matrix.duration }}*int('${{ matrix.shard }}')); print(t.isoformat(timespec='seconds'))")
          export LUNASIGHT_CONTINUITY_START_UTC="$SHARD_START"
          python verify_de441_subsecond_limb_continuity.py
      - name: Upload resolution shard
        uses: actions/upload-artifact@v4
        with:
          name: lunasight-de441-subsecond-${{ matrix.step }}s-shard-${{ matrix.shard }}
          path: LunaSight_SPICE_Validation/site_observer_spk/de441_limb_subsecond_${{ matrix.step }}s_shard_${{ matrix.shard }}.csv
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Validate three grids, shard overlaps, and refinement trend
    runs-on: ubuntu-latest
    needs: sweep
    timeout-minutes: 30
    steps:
      - name: Checkout isolated science branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned comparison dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 scipy==1.14.1
      - name: Download all twenty resolution shards
        uses: actions/download-artifact@v4
        with:
          pattern: lunasight-de441-subsecond-*
          path: LunaSight_SPICE_Validation/site_observer_spk/artifacts
          merge-multiple: true
      - name: Compare complete 1s, 0.5s, and 0.25s grids
        working-directory: LunaSight_SPICE_Validation/site_observer_spk
        run: |
          python compare_de441_subsecond_limb_convergence.py \
            --one-glob 'artifacts/de441_limb_subsecond_1s_shard_*.csv' \
            --half-glob 'artifacts/de441_limb_subsecond_0.5s_shard_*.csv' \
            --quarter-glob 'artifacts/de441_limb_subsecond_0.25s_shard_*.csv' \
            --output de441_subsecond_convergence_summary.csv
      - name: Upload three-level convergence evidence
        uses: actions/upload-artifact@v4
        with:
          name: lunasight-de441-subsecond-convergence-report
          path: |
            LunaSight_SPICE_Validation/site_observer_spk/de441_subsecond_convergence_summary.csv
            LunaSight_SPICE_Validation/site_observer_spk/de441_subsecond_convergence_summary_detail.csv
          if-no-files-found: error
          retention-days: 30
