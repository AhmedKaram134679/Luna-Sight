name: Lunar Terrain Data Acquisition

on:
  workflow_call:
    inputs:
      observer_longitude_east:
        required: true
        type: string
      observer_latitude_deg:
        required: true
        type: string
      half_width_km:
        required: true
        type: string
      acquire_lola_5m:
        required: true
        type: boolean
      acquire_20m_support:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      observer_longitude_east:
        description: "Horizons observer longitude, east-positive degrees"
        required: true
        default: "200.0"
        type: string
      observer_latitude_deg:
        description: "Horizons observer geodetic latitude, degrees"
        required: true
        default: "-88.45"
        type: string
      half_width_km:
        description: "Half-width of local square extraction around observer"
        required: true
        default: "10"
        type: string
      acquire_lola_5m:
        description: "Acquire 5 m/pixel LOLA mosaic and count layer"
        required: true
        default: true
        type: boolean
      acquire_20m_support:
        description: "Acquire 20 m/pixel regional DEM and support layers"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: lunar-terrain-data-acquisition
  cancel-in-progress: false

jobs:
  acquire-and-inspect:
    env:
      GDAL_HTTP_MAX_RETRY: '4'
      GDAL_HTTP_RETRY_DELAY: '2'
      GDAL_HTTP_TIMEOUT: '120'
      GDAL_HTTP_CONNECTTIMEOUT: '30'
      CPL_VSIL_CURL_CACHE_SIZE: '16777216'
      CPL_VSIL_CURL_CHUNK_SIZE: '65536'
      GDAL_HTTP_USERAGENT: 'LunaSight scientific data acquisition'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science/lunar-terrain-coordinate-acquisition

      - name: Install matching system GDAL Python bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal python3-numpy python3-requests python3-bs4
          /usr/bin/python3 -c "from osgeo import gdal, osr; print('GDAL', gdal.VersionInfo())"

      - name: Validate observer inputs
        id: observer
        env:
          OBS_LON: ${{ inputs.observer_longitude_east }}
          OBS_LAT: ${{ inputs.observer_latitude_deg }}
          HALF_WIDTH_KM: ${{ inputs.half_width_km }}
        run: |
          /usr/bin/python3 - <<'PY'
          import math, os
          lon=float(os.environ["OBS_LON"])
          lat=float(os.environ["OBS_LAT"])
          half=float(os.environ["HALF_WIDTH_KM"])
          if not all(map(math.isfinite,(lon,lat,half))):
              raise SystemExit("Observer inputs must be finite")
          if not -360.0 <= lon <= 360.0 or not -90.0 <= lat <= 90.0:
              raise SystemExit("Longitude/latitude outside accepted ranges")
          if not 0.5 <= half <= 25.0:
              raise SystemExit("half_width_km must be between 0.5 and 25 km")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"longitude={lon}\nlatitude={lat}\nhalf_width_m={half*1000.0}\n")
          PY

      - name: Test and discover exact official LOLA source links
        run: |
          set -euo pipefail
          cd LunaSight_Terrain_Validation
          /usr/bin/python3 -m unittest discover -s tests -p 'test_discover_lola_sources.py' -v
          cd ..
          /usr/bin/python3 LunaSight_Terrain_Validation/discover_lola_sources.py --output official_sources.json

      - name: Diagnose NASA HTTP HEAD and byte-range access
        run: |
          set -euo pipefail
          cd LunaSight_Terrain_Validation
          /usr/bin/python3 -m unittest discover -s tests -p 'test_validate_remote_access.py' -v
          cd ..
          /usr/bin/python3 LunaSight_Terrain_Validation/validate_remote_access.py --sources official_sources.json --output remote_access_diagnostics.json --range-size 1024

      - name: Diagnose IFD offset with independent requests, curl and GDAL clients
        run: |
          set -euo pipefail
          cd LunaSight_Terrain_Validation
          /usr/bin/python3 -m unittest discover -s tests -p 'test_diagnose_cog_range_client_matrix.py' -v
          cd ..
          /usr/bin/python3 LunaSight_Terrain_Validation/diagnose_cog_range_client_matrix.py \
            --sources official_sources.json \
            --product ldem_87s_5mpp \
            --offset 197624 \
            --output cog_range_client_matrix.json

      - name: Upload targeted COG range diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunasight-cog-range-diagnostics
          path: cog_range_client_matrix.json
          if-no-files-found: warn
          retention-days: 30

      - name: Resolve observer in the actual 20 m LOLA raster CRS
        id: projection
        env:
          OBS_LON: ${{ steps.observer.outputs.longitude }}
          OBS_LAT: ${{ steps.observer.outputs.latitude }}
        run: |
          set -euo pipefail
          URL=$(/usr/bin/python3 -c "import json; print(json.load(open('official_sources.json'))['LDEM_80S_20MPP_ADJ.TIF']['download_url'])")
          /usr/bin/python3 LunaSight_Terrain_Validation/resolve_observer_projection.py \
            --raster "/vsicurl/$URL" \
            --longitude-east "$OBS_LON" --latitude "$OBS_LAT" \
            --output observer_projection.json
          /usr/bin/python3 - <<'PY'
          import json, os
          d=json.load(open("observer_projection.json"))
          xy=d["native_map_coordinates_m"]
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"x={xy['x']}\ny={xy['y']}\n")
          print(json.dumps({
              "native_map_coordinates_m":xy,
              "pixel_coordinates":d["pixel_coordinates"],
              "observer_inside_raster_rectangle":d["observer_inside_raster_rectangle"],
              "frame_compatibility":d["frame_compatibility"]
          },indent=2))
          PY

      - name: Validate affine pixel-window math
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest LunaSight_Terrain_Validation.tests.test_extract_lola_pixel_windows -v

      - name: Extract independent 5m and 20m LOLA elevation windows
        env:
          HALF_WIDTH: ${{ steps.observer.outputs.half_width_m }}
          ACQUIRE_5M: ${{ inputs.acquire_lola_5m }}
          ACQUIRE_20M: ${{ inputs.acquire_20m_support }}
          OBS_LON: ${{ steps.observer.outputs.longitude }}
          OBS_LAT: ${{ steps.observer.outputs.latitude }}
        run: |
          set -euo pipefail
          mkdir -p terrain_data/source_metadata terrain_data/subsets
          cp remote_access_diagnostics.json terrain_data/remote_access_diagnostics.json
          cp observer_projection.json terrain_data/observer_projection_20m_diagnostic.json
          ARGS=()
          if [ "$ACQUIRE_5M" = "true" ]; then ARGS+=(--include-5m); fi
          if [ "$ACQUIRE_20M" = "true" ]; then ARGS+=(--include-20m); fi
          /usr/bin/python3 LunaSight_Terrain_Validation/extract_lola_pixel_windows.py \
            --sources official_sources.json \
            --output-dir terrain_data/subsets \
            --report terrain_data/pixel_window_extraction_report.json \
            --longitude-east "$OBS_LON" --latitude "$OBS_LAT" \
            --half-width-m "$HALF_WIDTH" "${ARGS[@]}"
          /usr/bin/python3 - <<'PY'
          import json, pathlib
          report=json.load(open("terrain_data/pixel_window_extraction_report.json"))
          if report.get("status") != "PASS":
              raise SystemExit("Pixel-window extraction report did not pass")
          for product in report["products"]:
              if product["pixel_window_validation"] != "PASS_POSITIVE_AND_IN_BOUNDS":
                  raise SystemExit("A product has an invalid pixel window")
              if product["subset_dimensions"] != product["pixel_window_xoff_yoff_xsize_ysize"][2:]:
                  raise SystemExit("Subset dimensions do not match the validated pixel window")
          print(json.dumps({"status":report["status"],"products":len(report["products"]),
                            "windows":[p["pixel_window_xoff_yoff_xsize_ysize"] for p in report["products"]]},indent=2))
          PY

      - name: Build checksums and inventory
        run: |
          set -euo pipefail
          find terrain_data -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > terrain_data/SHA256SUMS.txt
          find terrain_data -type f -printf '%p %s bytes\n' | sort
          cat terrain_data/acquisition_manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: lunasight-lola-local-subsets
          path: terrain_data/
          if-no-files-found: error
          retention-days: 30
